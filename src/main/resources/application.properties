spring.application.name=cinetrack
# ===========================
# Database Config
# ===========================
# Cadena JDBC completa (host, base de datos, usuario, contrasena y sslmode)
# inyectada como una unica variable de entorno, que es lo que entregan Neon y
# el resto de PaaS. Sin valor por defecto a proposito: la cadena contiene la
# contrasena, asi que es un secreto, y si falta el arranque debe fallar de
# forma ruidosa en vez de conectar en silencio a un sitio equivocado.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Server
# ===========================
server.port=${PORT:8080}

# ===========================
# JWT
# ===========================
jwt.expiration=86400000
# Sin valor por defecto: un secreto de relleno conocido en el repo firmaria
# tokens validos si alguien olvida definir JWT_SECRET en produccion.
jwt.secret=${JWT_SECRET}

# ===========================
# TMDB Configuration
# ===========================
tmdb.base-url=https://api.themoviedb.org/3
tmdb.api-key=${TMDB_API_KEY}
