spring.application.name=cinetrack
# ===========================
# Database Config
# ===========================
# Variables inyectadas por el plugin de PostgreSQL de Railway. Sin valor por
# defecto a proposito: si falta alguna, el arranque debe fallar de forma
# ruidosa en vez de intentar conectar en silencio a un sitio equivocado.
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===========================
# Server
# ===========================
server.port=${PORT:8080}

# ===========================
# JWT
# ===========================
jwt.expiration=86400000
# Sin valor por defecto: un secreto de relleno conocido en el repo firmaria
# tokens validos si alguien olvida definir JWT_SECRET en produccion.
jwt.secret=${JWT_SECRET}

# ===========================
# TMDB Configuration
# ===========================
tmdb.base-url=https://api.themoviedb.org/3
tmdb.api-key=${TMDB_API_KEY}
