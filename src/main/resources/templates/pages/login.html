<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <!-- El título real se pasa desde el controller -->
</head>

<body>
<!-- Icon sprite -->
<svg th:replace="~{fragments/layout :: icon-sprite}"></svg>
<!-- Navbar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="login-container">
    <!-- Fondo de página completa -->
    <div class="login-backdrop" aria-hidden="true"></div>

    <!-- Tarjeta de login -->
    <div class="auth-card">
        <div class="brand-title">
            <img src="/images/cinetrack-icon-64.png" alt="" class="brand-icon">
            <h1>CineTrack</h1>
        </div>
        <h2>Iniciar sesión</h2>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>

        <div id="error-message" class="error"></div>
        <div id="success-message" class="success"></div>

        <p class="auth-footer-link">
            ¿No tienes cuenta? <a href="/register">Regístrate aquí</a>
        </p>
    </div>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: api-script}"></script>
<script th:replace="~{fragments/layout :: app-script}"></script>
<script th:src="@{/js/login.js}"></script>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
