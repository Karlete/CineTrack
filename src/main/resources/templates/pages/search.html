<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <!-- El título real se pasa desde el controller -->
</head>

<body>
<!-- Navbar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="search-container">
    <h1>Buscar Películas</h1>

    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Busca una película...">
        <button id="search-button">Buscar</button>
    </div>

    <div id="results" class="results-grid">
        <!-- Los resultados se insertan aquí dinámicamente desde JS -->
    </div>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: api-script}"></script>
<script th:replace="~{fragments/layout :: app-script}"></script>
<script th:src="@{/js/search.js}"></script>
</body>
</html>
