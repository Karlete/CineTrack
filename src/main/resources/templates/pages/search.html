<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <!-- The real title is passed from the controller -->
</head>

<body>
<!-- Icon sprite -->
<svg th:replace="~{fragments/layout :: icon-sprite}"></svg>
<!-- Navbar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="search-container">
    <div class="search-hero">
        <div class="search-hero-backdrop" aria-hidden="true"></div>

        <div class="search-hero-content">
            <h1>Buscar Películas</h1>
            <div class="search-bar">
                <svg class="icon search-bar-icon">
                    <use href="#icon-search"></use>
                </svg>
                <input type="text" id="search-input" placeholder="Busca una película...">
                <button id="search-button" class="btn-primary">Buscar</button>
            </div>
        </div>
    </div>

    <div id="search-placeholder" class="popular-section">
        <h2>Populares ahora</h2>
        <div id="popular-grid" class="results-grid"></div>
    </div>

    <div id="results" class="results-grid"></div>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: api-script}"></script>
<script th:replace="~{fragments/layout :: app-script}"></script>
<script th:src="@{/js/search.js}"></script>
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
