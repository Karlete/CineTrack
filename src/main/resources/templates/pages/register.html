<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <!-- The real title is passed from the controller -->
</head>

<body>
<!-- Icon sprite -->
<svg th:replace="~{fragments/layout :: icon-sprite}"></svg>
<!-- Navbar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="register-container">
    <!-- Full page background -->
    <div class="register-backdrop" aria-hidden="true"></div>

    <!-- Registration card -->
    <div class="auth-card">
        <div class="brand-title">
            <img src="/images/cinetrack-icon-64.png" alt="" class="brand-icon">
            <h1>CineTrack</h1>
        </div>
        <h2>Crear cuenta</h2>

        <form id="register-form">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" id="username" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <div id="error-message" class="error"></div>

        <p class="auth-footer-link">
            ¿Ya tienes cuenta? <a href="/login">Inicia sesión aquí</a>
        </p>
    </div>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: api-script}"></script>
<script th:replace="~{fragments/layout :: app-script}"></script>
<script th:src="@{/js/register.js}"></script>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
