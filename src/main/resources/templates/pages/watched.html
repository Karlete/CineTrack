<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <!-- Title is passed from the controller -->
</head>

<body>
<!-- Navbar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="watched-container">
    <!-- Full page background -->
    <div class="watched-backdrop" aria-hidden="true"></div>

    <!-- Real content, on top -->
    <div class="watched-content">
        <h1>Mis Películas Vistas</h1>

        <div id="results" class="results-grid">
            <!-- Results will be loaded dynamically by JS -->
        </div>
    </div>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: api-script}"></script>
<script th:replace="~{fragments/layout :: app-script}"></script>
<script th:src="@{/js/watched.js}"></script>
<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
