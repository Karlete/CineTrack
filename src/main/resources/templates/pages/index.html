<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <!-- El título real se pasa desde el controller -->
</head>

<body>
<!-- Navbar -->
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="home-container">
    <div class="hero">
        <h1>CineTrack</h1>
        <p class="tagline">Tu diario personal de películas vistas</p>
        <p class="description">
            Registra qué películas has visto, busca nuevas recomendaciones
            y lleva un seguimiento de tu cine personal.
        </p>

        <div class="actions">
            <a href="/search" class="btn-primary">Buscar películas</a>
            <a href="/login" class="btn-secondary">Iniciar sesión</a>
            <a href="/register" class="btn-secondary">Crear cuenta</a>
        </div>
    </div>
</main>

<!-- Scripts -->
<script th:replace="~{fragments/layout :: api-script}"></script>
<script th:replace="~{fragments/layout :: app-script}"></script>
</body>
</html>
