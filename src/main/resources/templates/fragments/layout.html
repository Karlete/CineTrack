<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'CineTrack'">CineTrack</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/cinetrack-icon-32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/cinetrack-icon-16.png}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/images/cinetrack-icon-180.png}">
</head>

<body>
<!-- Icon sprite -->
<svg th:fragment="icon-sprite" style="display: none;">
    <symbol id="icon-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </symbol>

    <symbol id="icon-stamp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <polyline points="7 12 10 15 17 8"></polyline>
    </symbol>

    <symbol id="icon-list" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
        <line x1="8" y1="6" x2="21" y2="6"></line>
        <line x1="8" y1="12" x2="21" y2="12"></line>
        <line x1="8" y1="18" x2="21" y2="18"></line>
        <line x1="3" y1="6" x2="3.01" y2="6"></line>
        <line x1="3" y1="12" x2="3.01" y2="12"></line>
        <line x1="3" y1="18" x2="3.01" y2="18"></line>
    </symbol>
</svg>

<!-- Common navbar -->
<nav th:fragment="navbar">
    <a href="/">CineTrack</a>
    <a href="/search">Buscar películas</a>

    <div id="auth-section">
        <!-- JS will fill in login/logout here based on the token -->
    </div>
</nav>

<!-- Common footer -->
<footer th:fragment="footer">
    <div class="footer-content">
        <p>&copy; 2026 CineTrack — Creado por <strong>Sanprieto</strong></p>
        <p class="footer-attribution">
            Datos de películas proporcionados por
            <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
            Este producto usa la API de TMDB pero no está respaldado ni certificado por TMDB.
        </p>
        <div class="footer-links">
            <a href="https://github.com/Karlete/CineTrack" target="_blank" rel="noopener">Código fuente en GitHub</a>
        </div>
    </div>
</footer>

<!-- Common scripts -->
<script th:fragment="api-script" th:src="@{/js/api.js}"></script>
<script th:fragment="app-script" th:src="@{/js/app.js}"></script>
</body>
</html>
